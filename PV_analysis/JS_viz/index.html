<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solar dashboards — PV_analysis (JS)</title>
  <link rel="stylesheet" href="styles.css?v=layout-1" />
  <script src="https://cdn.plot.ly/plotly-2.35.0.min.js"></script>
</head>
<body>
  <nav class="tabs" aria-label="Dashboard sections">
    <div class="tab-group tab-group--daily">
      <span class="tab-group__label">Daily analytics</span>
      <div class="tab-group__buttons">
        <button type="button" data-tab="powerbi" class="active">1 · Daily (PowerBI-style)</button>
        <button type="button" data-tab="difference">2 · Difference</button>
        <button type="button" data-tab="library">3 · PVLib chart</button>
      </div>
    </div>
    <div class="tab-group tab-group--season">
      <span class="tab-group__label">Seasonal</span>
      <div class="tab-group__buttons">
        <button type="button" data-tab="seasonperf">4 · Season Analysis</button>
        <button type="button" data-tab="seasonirr">5 · Season + irradiance</button>
      </div>
    </div>
    <div class="tab-group tab-group--degradation">
      <span class="tab-group__label">Degradation</span>
      <div class="tab-group__buttons">
        <button type="button" data-tab="degradation">6 · Meter degradation</button>
        <button type="button" data-tab="alldegradation">7 · All meters degradation</button>
      </div>
    </div>
    <div class="tab-group tab-group--health">
      <span class="tab-group__label">Maintenance</span>
      <div class="tab-group__buttons">
        <button type="button" data-tab="health">8 · Health monitor</button>
      </div>
    </div>
    <div class="tab-group tab-group--forecast">
      <span class="tab-group__label">Forward look</span>
      <div class="tab-group__buttons">
        <button type="button" data-tab="forecast">9 · 7-day forecast</button>
      </div>
    </div>
  </nav>

  <header class="header">
    <div class="controls">
      <label>Meter
        <select id="global-meter" class="meter-select"></select>
      </label>
      <span id="load-status" style="color:#cbd5e1;font-size:0.85rem;">Starting…</span>
      <label>From <input type="date" id="global-date-from" /></label>
      <label>To <input type="date" id="global-date-to" /></label>
      <button type="button" id="global-apply" class="btn btn-primary">Apply</button>
      <button type="button" id="preset-week" class="btn btn-secondary">1 Week</button>
      <button type="button" id="preset-month" class="btn btn-secondary">1 Month</button>
      <button type="button" id="preset-quarter" class="btn btn-secondary">3 Months</button>
      <button type="button" id="preset-all" class="btn btn-secondary">Full range</button>
    </div>
  </header>

  <main>
    <section id="panel-powerbi" class="panel active"></section>
    <section id="panel-difference" class="panel"></section>
    <section id="panel-library" class="panel"></section>
    <section id="panel-seasonperf" class="panel"></section>
    <section id="panel-seasonirr" class="panel"></section>
    <section id="panel-degradation" class="panel"></section>
    <section id="panel-alldegradation" class="panel"></section>
    <section id="panel-health" class="panel"></section>
    <section id="panel-forecast" class="panel"></section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
